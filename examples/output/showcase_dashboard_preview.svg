<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">earnings-call-risk-map deterministic dashboard preview</title>
  <desc id="desc">A static SVG substitute for a dashboard screenshot showing summary counts, risk and opportunity panels, stale badges, and review queue items.</desc>
  <rect width="1200" height="760" fill="#f5f7f9"/>
  <rect x="40" y="36" width="1120" height="688" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
  <text x="72" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5d6978">DETERMINISTIC STATIC DASHBOARD</text>
  <text x="72" y="125" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17202a">Earnings Call Risk Map</text>
  <text x="72" y="156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d6978">Public-safe showcase preview for v0.6.0</text>
  <rect x="72" y="184" width="360" height="32" rx="4" fill="#fff8e8" stroke="#d7b56d"/>
  <text x="88" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b621e">STATIC EDUCATIONAL CASE STUDY - NOT ADVICE</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="250" width="248" height="108" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <rect x="72" y="250" width="248" height="6" rx="3" fill="#a1372f"/>
    <text x="94" y="298" font-size="42" font-weight="700" fill="#17202a">3</text>
    <text x="94" y="331" font-size="16" font-weight="700" fill="#5d6978">Risks</text>
    <rect x="344" y="250" width="248" height="108" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <rect x="344" y="250" width="248" height="6" rx="3" fill="#1f7652"/>
    <text x="366" y="298" font-size="42" font-weight="700" fill="#17202a">3</text>
    <text x="366" y="331" font-size="16" font-weight="700" fill="#5d6978">Opportunities</text>
    <rect x="616" y="250" width="248" height="108" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <rect x="616" y="250" width="248" height="6" rx="3" fill="#6f4a9e"/>
    <text x="638" y="298" font-size="42" font-weight="700" fill="#17202a">4</text>
    <text x="638" y="331" font-size="16" font-weight="700" fill="#5d6978">Review Queue</text>
    <rect x="888" y="250" width="248" height="108" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <rect x="888" y="250" width="248" height="6" rx="3" fill="#8b621e"/>
    <text x="910" y="298" font-size="42" font-weight="700" fill="#17202a">2</text>
    <text x="910" y="331" font-size="16" font-weight="700" fill="#5d6978">Stale Badges</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="392" width="514" height="246" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="96" y="430" font-size="21" font-weight="700" fill="#17202a">Risks</text>
    <circle cx="100" cy="468" r="5" fill="#a1372f"/>
    <text x="118" y="474" font-size="16" font-weight="700" fill="#17202a">gross margin: 11 high</text>
    <rect x="280" y="456" width="80" height="22" rx="11" fill="#fff8e8" stroke="#d7b56d"/>
    <text x="293" y="472" font-size="12" font-weight="700" fill="#8b621e">stale&gt;90d</text>
    <text x="118" y="500" font-size="14" fill="#5d6978">Evidence links remain visible for human review.</text>
    <circle cx="100" cy="540" r="5" fill="#a1372f"/>
    <text x="118" y="546" font-size="16" font-weight="700" fill="#17202a">inventory days: 4 medium</text>
    <text x="118" y="572" font-size="14" fill="#5d6978">Static KPI context is preserved, not hidden.</text>
    <rect x="614" y="392" width="522" height="246" rx="8" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="638" y="430" font-size="21" font-weight="700" fill="#17202a">Review Queue</text>
    <circle cx="642" cy="468" r="5" fill="#6f4a9e"/>
    <text x="660" y="474" font-size="16" font-weight="700" fill="#17202a">stale data</text>
    <text x="660" y="500" font-size="14" fill="#5d6978">Older public notes are flagged for source refresh.</text>
    <circle cx="642" cy="540" r="5" fill="#6f4a9e"/>
    <text x="660" y="546" font-size="16" font-weight="700" fill="#17202a">missing evidence</text>
    <text x="660" y="572" font-size="14" fill="#5d6978">Items without URLs are separated for review.</text>
  </g>
  <rect x="72" y="664" width="1064" height="1" fill="#d9e0e8"/>
  <text x="72" y="694" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5d6978">PNG-free screenshot substitute: self-contained SVG, no scripts, no linked assets, no network fetches.</text>
</svg>
