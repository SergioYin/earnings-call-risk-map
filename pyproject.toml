[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-call-risk-map"
version = "0.9.3"
description = "Zero-dependency CLI for mapping earnings-call risks, opportunities, catalysts, and review queues."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
keywords = ["earnings", "risk", "cli", "research", "finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SergioYin/earnings-call-risk-map"

[project.scripts]
earnings-call-risk-map = "earnings_call_risk_map.cli:main"
evidence-handoff-audit = "earnings_call_risk_map.evidence_handoff_audit:cli_main"

[tool.setuptools.packages.find]
where = ["src"]
